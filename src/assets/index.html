<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camon - Live View</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header>
        <a href="#/" id="header-home" style="display:contents;cursor:pointer;color:inherit;text-decoration:none">
            <svg class="logo" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 21h18v-2H3v2zm3-4h2V7H6v10zm4 0h4V4h-4v13zm6 0h2v-7h-2v7z"/>
            </svg>
            <h1>Camon</h1>
        </a>
    </header>
    <main>
        <!-- Grid View -->
        <div id="grid-view">
            <div id="camera-grid"></div>
            <div id="no-cameras" class="placeholder" hidden>
                <p>No cameras configured</p>
            </div>
        </div>

        <!-- View 1: Live Monitor -->
        <div id="live-view" hidden>
            <div class="detail-header">
                <button id="back-btn" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    Back
                </button>
                <span id="detail-camera-name" class="detail-camera-name"></span>
            </div>
            <div class="detail-video-wrapper">
                <video id="detail-video" playsinline muted></video>
                <canvas id="bg-overlay"></canvas>
                <canvas id="stability-overlay"></canvas>
                <canvas id="mask-overlay" hidden></canvas>
                <div id="detail-loading" class="loading"><p>Loading...</p></div>
            </div>
            <div class="live-scrubber-bar">
                <span id="live-current-time" class="time-display">0:00</span>
                <div class="playback-progress-wrapper">
                    <div class="playback-progress-track">
                        <div id="live-progress-fill" class="playback-progress-fill"></div>
                    </div>
                    <input type="range" id="live-scrubber" class="live-scrubber" min="0" max="1000" value="1000" step="1">
                </div>
                <span id="live-duration" class="time-display">0:00</span>
                <button id="live-btn" class="live-badge-btn active" title="Jump to live">
                    <span class="live-dot"></span> LIVE
                </button>
            </div>
            <div class="live-controls">
                <div class="live-controls-left">
                    <button id="debug-link-btn" class="icon-btn" title="Detection debug">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C12.96 5.06 12.49 5 12 5s-.96.06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/>
                        </svg>
                    </button>
                </div>
                <div class="live-controls-right">
                    <button id="mute-toggle-btn" class="icon-btn muted" title="Toggle audio">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                    <button id="mask-toggle-btn" class="icon-btn" title="Toggle motion overlay">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/>
                        </svg>
                    </button>
                    <button id="bg-toggle-btn" class="icon-btn" title="Toggle background model">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/>
                        </svg>
                    </button>
                    <button id="settings-btn" class="icon-btn" title="Motion settings">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="motion-settings-panel" hidden>
                <div class="setting-row">
                    <label for="sensitivity-slider">Sensitivity threshold</label>
                    <input type="range" id="sensitivity-slider" min="4" max="96" step="1" value="16">
                    <span id="sensitivity-value" class="setting-value">16</span>
                    <span class="setting-hint">higher = less sensitive</span>
                </div>
                <div class="setting-row">
                    <label for="minsize-slider">Min object size</label>
                    <input type="range" id="minsize-slider" min="50" max="2000" step="10" value="200">
                    <span id="minsize-value" class="setting-value">200</span>
                    <span class="setting-hint">foreground pixels</span>
                </div>
                <div class="setting-row">
                    <button id="mask-edit-btn" class="settings-action-btn">Edit masks</button>
                    <span class="setting-hint">Paint cells on the video for the active mask below.</span>
                </div>
                <div class="setting-row" id="mask-layer-row" hidden>
                    <div id="mask-layer-toggle" class="mask-layer-toggle" role="group" aria-label="Mask layer">
                        <button id="layer-movement-btn" class="mask-layer-btn active" data-layer="movement">Movement mask</button>
                        <button id="layer-detection-btn" class="mask-layer-btn" data-layer="detection">Detection mask</button>
                    </div>
                    <span class="setting-hint" id="mask-layer-hint">Movement mask: nothing ever moves here (ignored by motion detection).</span>
                </div>
            </div>
            <div id="detection-gallery"></div>
            <div id="hot-events-strip"></div>
            <button id="events-summary-btn" class="events-summary-btn" hidden>
                <span id="events-summary-text">No events</span>
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
                </svg>
            </button>
            <div id="detection-tooltip" hidden>
                <img id="tooltip-image" alt="Detection frame">
                <span id="tooltip-label"></span>
            </div>
        </div>

        <!-- View 2: Event Browser -->
        <div id="events-view" hidden>
            <div class="detail-header">
                <button id="events-back-btn" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    Live
                </button>
                <span id="events-camera-name" class="detail-camera-name"></span>
            </div>
            <div class="event-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="object">Object</button>
                <button class="filter-btn" data-filter="movement">Movement</button>
            </div>
            <div id="event-list"></div>
        </div>

        <!-- View 4: Detection Debug -->
        <div id="debug-view" hidden>
            <div class="detail-header">
                <button id="debug-back-btn" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    Live
                </button>
                <span id="debug-camera-name" class="detail-camera-name"></span>
            </div>
            <div id="debug-list" class="debug-list"></div>
            <div id="debug-empty" class="placeholder" hidden>
                <p>No detection debug entries yet</p>
            </div>
        </div>

        <!-- View 3: Event Playback -->
        <div id="playback-view" hidden>
            <div class="detail-header">
                <button id="playback-back-btn" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    Events
                </button>
                <span id="playback-event-info" class="detail-camera-name"></span>
            </div>
            <div class="detail-video-wrapper">
                <video id="playback-video" playsinline muted></video>
                <div id="playback-loading" class="loading"><p>Loading...</p></div>
            </div>
            <div class="playback-controls">
                <span id="playback-current-time" class="time-display">0:00</span>
                <div class="playback-progress-wrapper">
                    <div class="playback-progress-track">
                        <div id="playback-progress-fill" class="playback-progress-fill"></div>
                    </div>
                    <input type="range" id="playback-scrubber" min="0" max="1000" value="0" step="1">
                </div>
                <span id="playback-duration" class="time-display">0:00</span>
                <button id="playback-mute-btn" class="icon-btn muted" title="Toggle audio">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>
            </div>
            <div class="playback-nav">
                <button id="prev-event-btn" class="event-nav-btn" hidden>
                    <img id="prev-event-thumb" class="nav-thumb" alt="Previous">
                    <div class="nav-label">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
                        </svg>
                        <span id="prev-event-text">Previous</span>
                    </div>
                </button>
                <div class="nav-spacer"></div>
                <button id="next-event-btn" class="event-nav-btn" hidden>
                    <img id="next-event-thumb" class="nav-thumb" alt="Next">
                    <div class="nav-label">
                        <span id="next-event-text">Next</span>
                        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
                        </svg>
                    </div>
                </button>
            </div>
        </div>
    </main>
    <footer>__VERSION__</footer>
    <script src="/assets/hls.min.js"></script>
    <script src="/assets/app.js"></script>
</body>
</html>
