name: Build add-on image

on:
  push:
    branches: ['master']
    paths:
      - camon-addon/**
      - .github/workflows/addon.yml
  pull_request:
    branches: ['master']
    paths:
      - camon-addon/**
      - .github/workflows/addon.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/amd64-addon-camon

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: echo "version=$(yq '.version' camon-addon/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Supervisor pulls `image` from config.yaml at the tag equal to the
      # add-on version, so the `:<version>` tag below is what installs use.
      # CAMON_VERSION keeps the source clone inside the Dockerfile pinned to
      # the release tag matching the add-on version.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: camon-addon
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            CAMON_VERSION=v${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            io.hass.name=Camon
            io.hass.description=Multi-camera NVR with real-time motion/object analytics and tiered storage
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
