name: Build add-on image

on:
  push:
    branches: ['master']
    tags: ['v*']
    paths:
      - camon-addon/**
      - Cargo.lock
      - Cargo.toml
      - build.rs
      - config.toml.example
      - src/**
      - .github/workflows/addon.yml
  pull_request:
    branches: ['master']
    paths:
      - camon-addon/**
      - Cargo.lock
      - Cargo.toml
      - build.rs
      - config.toml.example
      - src/**
      - .github/workflows/addon.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/amd64-addon-camon

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read build version
        id: meta
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$cargo" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo}" >&2
              exit 1
            fi
            echo "version=${tagged}" >> "$GITHUB_OUTPUT"
            echo "build_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${cargo}" >> "$GITHUB_OUTPUT"
            echo "build_version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: camon-addon/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          build-args: CAMON_BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            io.hass.name=Camon
            io.hass.description=Multi-camera NVR with real-time motion/object analytics and tiered storage
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
