name: Build and publish release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches the version in Cargo.toml
        # The self-updater runs a downloaded binary as `camon version` before it
        # installs it and refuses the release unless it reports exactly the tag
        # it was published under — a mismatch here would ship a release that no
        # camon installs (and, unchecked, one that every camon re-downloads
        # after every restart). Pre-release and build suffixes are fine; they
        # just have to be in both places.
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$tagged" != "$built" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${built}" >&2
            exit 1
          fi

      - name: Setup Rust toolchain
        run: rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build camon binary
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/camon camon-linux-glibc

      - name: Generate checksums
        run: sha256sum camon-linux-glibc > sha256sums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            camon-linux-glibc sha256sums.txt
