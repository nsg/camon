[package]
name = "camon"
version = "0.6.3"
edition = "2021"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "sync",
    "time",
    "net",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
axum = "0.8"
rust-embed = "8"
mime_guess = "2"
serde_json = "1"
# JPEG encode/decode only (RustSec-audited 2026-07-23: no open advisories).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.13.1", features = ["rustls-native-certs", "json", "stream"] }
# Object-safe async storage-backend trait (LocalDisk now, remote in phase 2).
async-trait = "0.1"
libc = "0.2"
base64 = "0.22.1"
sha2 = "0.10"
# Streaming warm-event playback (Range support). All four are already in the
# dependency tree via axum/reqwest/tokio; promoted to direct deps to name the
# boxed `Stream<Item = io::Result<Bytes>>` body type and adapt error/reader
# types. No new crates enter the build graph.
bytes = "1"
futures-core = "0.3"
# Minimal features: only the `Stream`/`TryStream` combinators, no async-await
# macro machinery (keeps futures-macro out of the graph).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
# MQTT 3.1.1 client for the Home Assistant bridge. Default features off: the
# broker is a LAN service reached over plain TCP, so the rustls stack the
# default `use-rustls` feature pulls in would be dead weight.
rumqttc = { version = "0.25.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
# Paused-clock tests (`#[tokio::test(start_paused = true)]`) for the retention
# schedule: an hourly cadence is otherwise only testable with real sleeps and a
# loaded machine turns those into flakes. A feature on a crate already in the
# graph — no new crate enters the build, and dev-dependency features do not
# reach the release binary.
tokio = { version = "1", features = ["test-util"] }
