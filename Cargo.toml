[package]
name = "camon"
version = "0.2.9"
edition = "2021"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "sync",
    "time",
    "net",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
axum = "0.8"
rust-embed = "8"
mime_guess = "2"
serde_json = "1"
opencv = { version = "0.98.1", features = ["clang-runtime"] }
reqwest = { version = "0.13.1", features = ["rustls-native-certs", "json"] }
libc = "0.2"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3.27.0"
