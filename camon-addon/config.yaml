# Home Assistant add-on manifest for Camon.
# Schema: https://developers.home-assistant.io/docs/add-ons/configuration
#
# amd64 only, on purpose: Camon spawns ffmpeg/ffprobe and is only tested on
# x86_64 here. ARM is deliberately deferred (see HOMEASSISTANT.md).
name: Camon
slug: camon
version: "0.3.0"
description: Multi-camera NVR with real-time motion/object analytics and tiered storage
url: https://github.com/nsg/camon
arch:
  - amd64
# `application` waits for Home Assistant + Supervisor to be up before start.
startup: application
boot: auto
# We build from a plain Debian runtime (no s6-overlay), so let Docker's own
# init stay out of the way and run our CMD as PID 1 for direct SIGTERM.
init: false

# --- Ingress: embed the Camon web UI in the Home Assistant sidebar ----------
# Home Assistant proxies the ingress path to this internal port and strips the
# path prefix, so Camon's HTTP server (which serves the UI at "/") needs no
# awareness of the prefix — the web assets use relative URLs.
ingress: true
# An uncommon internal port ("camon" on a phone keypad) so it can never
# collide with anything even if the add-on later gains host networking or a
# direct port mapping. With ingress-only access no host port is bound at all.
ingress_port: 22666
panel_icon: mdi:cctv
panel_title: Camon
panel_admin: true

# The add-on is configured entirely by a camon.toml file — the SAME format as a
# native install — so there is no `options:`/`schema:` block here (both are
# optional per the HA add-on docs, omitted when there are no UI options).
#
# /data is the add-on's own persistent volume (always mounted; recordings live
# under /data/storage). addon_config mounts the add-on's user folder
# (/addon_configs/..._camon) at /config read-write, where the user creates
# camon.toml; run.sh seeds a commented camon.toml.example there on first start
# (see run.sh and HOMEASSISTANT.md).
map:
  - addon_config:rw
